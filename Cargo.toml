[package]
name = "sicth"
version = "0.1.0"
edition = "2021"

[dependencies]
ignore = "0.4.32"
infer = "0.22.0"
nucleo = "0.5.0"
nucleo-matcher = "0.3.1"
open = "5.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
